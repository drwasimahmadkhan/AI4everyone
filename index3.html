<style>
  :root{
    --bg:#eef8f2; --ink:#10251d; --muted:#5d7168; --green:#087b4d; --gold:#bd8200; --line:#cfe1d8;
    --card:rgba(255,255,255,.92); --soft:#f7fbf8; --shadow:0 24px 70px rgba(11,47,33,.14);
    --blue:#246bfe; --purple:#7a3ff2; --red:#d64242; --orange:#d9831f; --teal:#008b8b;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0;overflow:hidden;background:
    linear-gradient(90deg, rgba(8,123,77,.045) 1px, transparent 1px) 0 0/48px 48px,
    linear-gradient(rgba(8,123,77,.045) 1px, transparent 1px) 0 0/48px 48px,
    radial-gradient(circle at 10% 5%,rgba(8,123,77,.11),transparent 28%),
    radial-gradient(circle at 90% 95%,rgba(189,130,0,.10),transparent 30%), var(--bg);
    color:var(--ink);font-family:Inter,Segoe UI,Arial,"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",sans-serif}
  .slide{position:fixed;inset:0;display:none;padding:clamp(14px,2vw,28px);}
  .slide.active{display:block;animation:fade .28s ease-out}
  @keyframes fade{from{opacity:.25;transform:scale(.995)}to{opacity:1;transform:scale(1)}}
  .frame{height:100%;border:1px solid var(--line);border-radius:clamp(18px,2.3vw,34px);background:var(--card);box-shadow:var(--shadow);padding:clamp(18px,3vw,42px);display:flex;flex-direction:column;gap:clamp(10px,1.3vw,18px);position:relative;overflow:hidden}
  .slideNo{position:absolute;right:clamp(14px,2.3vw,30px);top:clamp(12px,2vw,24px);font-weight:900;color:var(--green);font-size:clamp(12px,1.3vw,16px);background:#eaf7f0;border:1px solid #cce8da;padding:8px 13px;border-radius:999px;z-index:3}
  .tag{letter-spacing:.13em;text-transform:uppercase;color:var(--green);font-weight:900;font-size:clamp(11px,1.1vw,14px)}
  h1{font-size:clamp(34px,5.3vw,78px);line-height:.96;margin:0;letter-spacing:-.055em;max-width:92%}
  h2{font-size:clamp(26px,3.6vw,56px);line-height:1.02;margin:0;letter-spacing:-.035em;max-width:92%}
  h3{font-size:clamp(16px,1.55vw,23px);margin:0 0 8px;color:var(--gold)}
  p,li{font-size:clamp(15px,1.35vw,21px);line-height:1.48;margin:.25em 0}
  ul{margin:.2em 0 0;padding-left:1.15em}.rtl ul{padding-left:0;padding-right:1.15em}.rtl{direction:rtl;text-align:right;font-family:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",Tahoma,Arial,sans-serif}.rtl p,.rtl li{line-height:1.9;font-size:clamp(15px,1.45vw,22px)}
  .lead{font-size:clamp(18px,1.8vw,28px);line-height:1.35;color:#18372b}.rtl.lead{line-height:1.8}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(12px,1.8vw,24px);min-height:0;flex:1}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:clamp(10px,1.4vw,18px);min-height:0;flex:1}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:clamp(10px,1.3vw,16px)}
  .panel,.note,.mini{background:linear-gradient(180deg,#fff,rgba(248,252,250,.96));border:1px solid var(--line);border-radius:clamp(16px,1.8vw,25px);padding:clamp(14px,1.8vw,24px);overflow:auto;min-height:0}.note{background:#f5fbf7}.mini{padding:clamp(12px,1.4vw,18px)}
  .bigQuote{border-left:7px solid var(--green);padding-left:22px;background:#f7fbf8}.rtl.bigQuote{border-left:0;border-right:7px solid var(--green);padding-left:0;padding-right:22px}
  .source{font-size:clamp(10px,1vw,13px);color:var(--muted);border-top:1px dashed #c4d8cf;padding-top:8px;margin-top:auto}.source b{color:var(--green)}
  .pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:800;margin:3px;color:#173429}.dot{width:10px;height:10px;border-radius:50%;display:inline-block}.green{--c:var(--green)}.blue{--c:var(--blue)}.purple{--c:var(--purple)}.orange{--c:var(--orange)}.red{--c:var(--red)}.teal{--c:var(--teal)}.colorCard{border-top:8px solid var(--c);background:linear-gradient(180deg, color-mix(in srgb, var(--c) 10%, white), #fff);border-radius:24px;border-left:1px solid color-mix(in srgb, var(--c) 28%, white);border-right:1px solid color-mix(in srgb, var(--c) 28%, white);border-bottom:1px solid color-mix(in srgb, var(--c) 28%, white);padding:18px;min-height:0;overflow:auto}.colorCard h3{color:var(--c)}.colorCard .dot{background:var(--c)}
  .columns{display:grid;grid-template-columns:.9fr 1.1fr;gap:20px;min-height:0;flex:1}.timeline{display:grid;gap:10px}.time{display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:start}.time b{color:var(--green)}
  .promptBox{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;background:#0e2119;color:#eafff5;border-radius:18px;padding:16px;white-space:pre-wrap;font-size:clamp(13px,1.25vw,18px);line-height:1.55;overflow:auto}
  .nav{position:fixed;right:22px;bottom:18px;display:flex;gap:10px;z-index:20}.nav button,.fs{border:1px solid var(--line);background:#fff;color:#123024;border-radius:999px;padding:12px 16px;font-weight:900;font-size:15px;box-shadow:0 12px 30px rgba(10,50,35,.12);cursor:pointer}.fs{position:fixed;left:18px;bottom:18px;z-index:20}.nav button:active,.fs:active{transform:scale(.97)}
  .activity{border:2px dashed #aacdbc;background:#f8fffb}.center{display:grid;place-items:center;text-align:center}.center h1,.center h2{max-width:100%}.urduOnly{font-size:clamp(18px,2vw,31px);line-height:1.9;color:#0b6f45;font-weight:800}.englishOnly{font-size:clamp(18px,2vw,29px);line-height:1.35;color:#122b21}
  @media(max-width:900px){.slide{padding:0}.frame{border-radius:0;border:0;padding:18px 15px 74px}.slideNo{right:14px;top:12px}.grid2,.grid3,.columns{grid-template-columns:1fr}.grid4{grid-template-columns:1fr 1fr}.panel,.note,.mini,.colorCard{padding:13px}.nav{right:12px;bottom:10px}.fs{left:12px;bottom:10px}.nav button,.fs{padding:10px 13px;font-size:14px}h1{font-size:clamp(34px,11vw,56px)}h2{font-size:clamp(28px,8.2vw,44px)}p,li{font-size:16px}.rtl p,.rtl li{font-size:16px;line-height:1.8}.source{font-size:11px}.time{grid-template-columns:70px 1fr}}
  @media(max-width:520px){.grid4{grid-template-columns:1fr}.slideNo{font-size:11px;padding:6px 10px}.frame{gap:10px}.tag{font-size:11px}h1,h2{max-width:88%}.lead{font-size:17px}.rtl.lead{font-size:17px}.promptBox{font-size:13px}.pill{font-size:13px;padding:7px 10px}}
  @media print{html,body{overflow:visible}.slide{position:relative;display:block;page-break-after:always;height:100vh}.nav,.fs{display:none}.frame{box-shadow:none}}
</style>

<script>
const slides = [
{tag:'Course Opening', title:'AI Beyond the Hype', urdu:'AI کو افواہ، جادو یا صرف ایک ٹول نہیں — ایک نیا علمی، معاشی اور سماجی نظام سمجھنا ہے۔', mins:'3 min', body:`<div class="grid2"><div class="panel"><p class="lead">A two-session course for students, public learners, religious workers, teachers, media teams, and decision makers.</p><ul><li>Not basic awareness only.</li><li>Not tool promotion.</li><li>Focus: what AI is, what people misunderstand, how to use it safely.</li></ul></div><div class="panel rtl"><p class="lead rtl">یہ کورس عام لوگوں، طلبہ، اساتذہ، دینی حلقوں اور اداروں کے لیے ہے۔</p><ul><li>صرف “AI کیا ہے؟” نہیں۔</li><li>صرف tools کی لسٹ نہیں۔</li><li>اصل مقصد: سمجھ، احتیاط، استعمال اور مستقبل کی تیاری۔</li></ul></div></div>`, source:'Course design: 2 × 1 hour, bilingual, practical + research-based.'},
{tag:'Course Map', title:'Two 1-Hour Sessions', urdu:'دو ایک گھنٹے کے سیشن', body:`<div class="grid2"><div class="panel"><h3>Session 1 — Understanding AI</h3><p>AI in simple language, how modern AI works, what most people do not know, common myths, hallucination, data, bias, and trust.</p><div class="timeline"><div class="time"><b>0–10</b><span>Why AI matters now</span></div><div class="time"><b>10–30</b><span>How modern AI actually works</span></div><div class="time"><b>30–50</b><span>Hidden risks and misconceptions</span></div><div class="time"><b>50–60</b><span>Discussion activity</span></div></div></div><div class="panel rtl"><h3>سیشن 1 — AI کی سمجھ</h3><p>AI کو آسان زبان میں سمجھنا، جدید AI کیسے کام کرتی ہے، عام غلط فہمیاں، hallucination، data، bias اور trust۔</p><div class="timeline"><div class="time"><b>0–10</b><span>AI ابھی کیوں اہم ہے؟</span></div><div class="time"><b>10–30</b><span>جدید AI اندر سے کیسے کام کرتی ہے؟</span></div><div class="time"><b>30–50</b><span>چھپے ہوئے risks اور غلط فہمیاں</span></div><div class="time"><b>50–60</b><span>Discussion activity</span></div></div></div></div>`},
{tag:'Course Map', title:'Session 2: Use AI Without Losing Judgment', urdu:'AI استعمال کریں مگر فیصلہ انسان کا رہے', body:`<div class="grid2"><div class="panel"><h3>Session 2 — Practice & Responsibility</h3><p>Prompting, verification, study use-cases, religious-content precautions, workflows, and a 7-day practice plan.</p><div class="timeline"><div class="time"><b>0–15</b><span>Prompting as task design</span></div><div class="time"><b>15–35</b><span>Use-cases for students, teachers, public work</span></div><div class="time"><b>35–50</b><span>Responsible use and verification</span></div><div class="time"><b>50–60</b><span>Personal action plan</span></div></div></div><div class="panel rtl"><h3>سیشن 2 — عمل اور ذمہ داری</h3><p>Prompting، verification، طلبہ اور اساتذہ کے use-cases، دینی مواد کی احتیاط، workflows اور 7 دن کا practice plan۔</p><div class="timeline"><div class="time"><b>0–15</b><span>Prompting اصل میں task design ہے</span></div><div class="time"><b>15–35</b><span>طلبہ، اساتذہ اور عوامی کام</span></div><div class="time"><b>35–50</b><span>ذمہ دار استعمال اور تصدیق</span></div><div class="time"><b>50–60</b><span>اپنا action plan</span></div></div></div></div>`},
{tag:'Core Idea', title:'AI is not magic. It is learned pattern + useful prediction.', urdu:'AI جادو نہیں، data سے سیکھا ہوا pattern اور prediction ہے۔', body:`<div class="grid2"><div class="panel bigQuote"><p class="lead">Most AI does not “know” the way a human knows. It detects patterns from data and produces likely outputs for a task.</p><ul><li>For text: likely next words/tokens.</li><li>For images: learned visual patterns.</li><li>For decisions: learned statistical relationships.</li></ul></div><div class="panel rtl bigQuote"><p class="lead rtl">AI انسان کی طرح شعور یا نیت سے نہیں جانتی۔ یہ data میں patterns سیکھ کر کسی کام کے لیے ممکنہ جواب دیتی ہے۔</p><ul><li>Text میں: اگلے الفاظ/tokens کا اندازہ۔</li><li>Images میں: visual patterns کی پہچان۔</li><li>Decisions میں: statistical relationships کا استعمال۔</li></ul></div></div>`},
{tag:'Unique Insight 01', title:'The hidden word: “prediction”', urdu:'چھپا ہوا لفظ: prediction', body:`<div class="grid2"><div class="panel"><p class="lead">Many experts describe AI as a prediction technology. The power is not only that it answers questions — it lowers the cost of prediction.</p><ul><li>Translate this sentence.</li><li>Predict the next word.</li><li>Predict if this image contains disease.</li><li>Predict what reply may help a learner.</li></ul></div><div class="panel rtl"><p class="lead rtl">AI کی بڑی طاقت یہ ہے کہ prediction سستی اور تیز ہو گئی ہے۔ یہ صرف جواب نہیں دیتی، اندازہ لگانے کا خرچ کم کرتی ہے۔</p><ul><li>یہ جملہ translate ہو سکتا ہے؟</li><li>اگلا لفظ کیا آئے گا؟</li><li>تصویر میں بیماری کا اشارہ ہے؟</li><li>طالب علم کو کون سا جواب مدد دے گا؟</li></ul></div></div>`, source:'Idea inspired by Agrawal, Gans & Goldfarb, “Prediction Machines” (2018).'},
{tag:'History', title:'AI is old. Useful AI at scale is new.', urdu:'AI پرانی ہے، مگر بڑے پیمانے پر مفید AI نئی ہے۔', body:`<div class="grid2"><div class="panel"><p>Alan Turing asked the famous question “Can machines think?” in 1950. The field had waves of excitement, disappointment, and progress.</p><ul><li>1950s–60s: early symbolic AI</li><li>1980s: expert systems</li><li>2010s: deep learning boom</li><li>2017+: Transformers</li><li>2022+: public generative AI explosion</li></ul></div><div class="panel rtl"><p>Alan Turing نے 1950 میں مشہور سوال اٹھایا کہ کیا مشینیں سوچ سکتی ہیں؟ AI میں کئی ادوار آئے: امید، ناکامی، پھر نئی ترقی۔</p><ul><li>1950s–60s: symbolic AI</li><li>1980s: expert systems</li><li>2010s: deep learning</li><li>2017+: Transformers</li><li>2022+: عام لوگوں کے لیے generative AI</li></ul></div></div>`, source:'Alan Turing, “Computing Machinery and Intelligence” (1950); Transformer paper by Vaswani et al. (2017).'},
{tag:'Why Now?', title:'Four engines made modern AI explode', urdu:'جدید AI چار چیزوں سے اچانک طاقتور ہوئی', body:`<div class="grid4"><div class="colorCard green"><h3><span class="dot"></span> Data</h3><p>Massive text, images, audio, code, and documents.</p><p class="rtl">بہت زیادہ text، تصاویر، آواز، code اور documents۔</p></div><div class="colorCard blue"><h3><span class="dot"></span> Compute</h3><p>GPUs, cloud, specialized chips, and scale.</p><p class="rtl">GPUs، cloud، chips اور scale۔</p></div><div class="colorCard purple"><h3><span class="dot"></span> Algorithms</h3><p>Deep learning, attention, reinforcement learning.</p><p class="rtl">Deep learning، attention اور reinforcement learning۔</p></div><div class="colorCard orange"><h3><span class="dot"></span> Interface</h3><p>Chat made AI usable for everyone.</p><p class="rtl">Chat interface نے AI کو ہر شخص کے لیے آسان بنا دیا۔</p></div></div>`},
{tag:'Unique Insight 02', title:'ChatGPT’s shock was not only intelligence — it was accessibility', urdu:'اصل تبدیلی صرف intelligence نہیں، accessibility تھی', body:`<div class="grid2"><div class="panel"><p class="lead">Before chat interfaces, powerful AI existed but most people could not use it. Chat turned AI into a daily conversation partner.</p><ul><li>No coding required.</li><li>No data science degree required.</li><li>Natural language became the interface.</li></ul></div><div class="panel rtl"><p class="lead rtl">Chat interface سے پہلے AI طاقتور تھی مگر عام آدمی کے لیے مشکل تھی۔ Chat نے AI کو روزمرہ گفتگو کا حصہ بنا دیا۔</p><ul><li>Code آنا لازم نہیں۔</li><li>Data science degree لازم نہیں۔</li><li>عام زبان ہی interface بن گئی۔</li></ul></div></div>`, source:'Reuters reported ChatGPT reached an estimated 100 million monthly active users two months after launch, citing UBS analysis.'},
{tag:'How LLMs Work', title:'A language model predicts tokens, not truth by default', urdu:'Language model tokens predict کرتا ہے، truth نہیں', body:`<div class="grid2"><div class="panel"><p class="lead">A token can be a word, part of a word, or symbol. The model produces the next likely token based on context.</p><ul><li>It can sound confident even when wrong.</li><li>It can generate fluent text without verified sources.</li><li>Truth requires grounding, checking, and context.</li></ul></div><div class="panel rtl"><p class="lead rtl">Token لفظ، لفظ کا حصہ یا symbol ہو سکتا ہے۔ Model context دیکھ کر اگلا ممکنہ token بناتا ہے۔</p><ul><li>غلط جواب بھی confident لگ سکتا ہے۔</li><li>بغیر source کے fluent بات کر سکتا ہے۔</li><li>درستگی کے لیے grounding، checking اور context چاہیے۔</li></ul></div></div>`},
{tag:'Transformers', title:'Attention changed AI', urdu:'Attention نے AI بدل دی', body:`<div class="grid2"><div class="panel"><p>The 2017 paper <b>“Attention Is All You Need”</b> introduced the Transformer architecture. Its big idea: instead of reading words only one-by-one, the model can learn which parts of the input matter most.</p><ul><li>Good for long context relationships.</li><li>Efficient for parallel training.</li><li>Foundation of many modern language models.</li></ul></div><div class="panel rtl"><p>2017 کے paper <b>“Attention Is All You Need”</b> نے Transformer architecture متعارف کرائی۔ سادہ بات: model یہ سیکھتا ہے کہ input کے کون سے حصے زیادہ important ہیں۔</p><ul><li>لمبے context کو سمجھنے میں مدد۔</li><li>Training زیادہ efficient۔</li><li>جدید language models کی بنیاد۔</li></ul></div></div>`, source:'Vaswani et al., “Attention Is All You Need,” arXiv 2017.'},
{tag:'Unique Insight 03', title:'AI can be fluent without being correct', urdu:'AI fluent ہو سکتی ہے مگر درست نہیں', body:`<div class="grid2"><div class="panel bigQuote"><p class="lead">Fluency is not evidence. A polished paragraph can still contain invented references, wrong dates, weak logic, or fake confidence.</p><ul><li>Beautiful wording ≠ verified fact.</li><li>Long answer ≠ deep understanding.</li><li>Confidence ≠ correctness.</li></ul></div><div class="panel rtl bigQuote"><p class="lead rtl">خوبصورت زبان دلیل نہیں۔ polished paragraph میں بھی fake references، غلط dates، کمزور logic یا جھوٹا confidence ہو سکتا ہے۔</p><ul><li>اچھی wording ≠ verified fact</li><li>لمبا جواب ≠ گہری سمجھ</li><li>اعتماد ≠ درستگی</li></ul></div></div>`},
{tag:'Hallucination', title:'Hallucination is not a small bug — it is a risk of the method', urdu:'Hallucination چھوٹی خرابی نہیں، طریقۂ کار کا risk ہے', body:`<div class="grid2"><div class="panel"><p>Generative AI creates likely outputs. If it lacks grounding, it may invent facts that look real.</p><ul><li>Fake scholar names</li><li>Wrong hadith attribution</li><li>Invented book references</li><li>Incorrect legal, medical, or financial advice</li></ul></div><div class="panel rtl"><p>Generative AI ممکنہ جواب بناتی ہے۔ اگر grounding نہ ہو تو یہ ایسی بات گھڑ سکتی ہے جو اصل جیسی لگتی ہے۔</p><ul><li>غلط scholar names</li><li>حدیث کی غلط نسبت</li><li>جعلی کتابی references</li><li>قانونی، طبی یا مالی غلط advice</li></ul></div></div>`, source:'NIST AI 600-1 highlights confabulation/hallucination and information integrity risks for generative AI.'},
{tag:'Unique Insight 04', title:'RAG is not training. It is open-book answering.', urdu:'RAG training نہیں، open-book answering ہے', body:`<div class="grid2"><div class="panel"><p class="lead">RAG means Retrieval-Augmented Generation. The AI first retrieves relevant documents, then answers using them.</p><ul><li>Better for organizational documents.</li><li>Better for verified religious references.</li><li>Still needs review; retrieved text may be incomplete.</li></ul></div><div class="panel rtl"><p class="lead rtl">RAG کا مطلب ہے: AI پہلے relevant documents تلاش کرتی ہے، پھر ان کی بنیاد پر جواب دیتی ہے۔</p><ul><li>ادارے کے documents کے لیے بہتر۔</li><li>verified دینی references کے لیے بہتر۔</li><li>پھر بھی review ضروری ہے؛ retrieved text incomplete ہو سکتا ہے۔</li></ul></div></div>`},
{tag:'Unique Insight 05', title:'Training, fine-tuning and prompting are different', urdu:'Training، fine-tuning اور prompting الگ چیزیں ہیں', body:`<div class="grid3"><div class="panel"><h3>Training</h3><p>Builds the model’s base capability from huge data.</p><p class="rtl">Model کی بنیادی صلاحیت بنانا۔</p></div><div class="panel"><h3>Fine-tuning</h3><p>Adapts a model to style, domain, or task examples.</p><p class="rtl">Model کو کسی خاص style یا domain پر adjust کرنا۔</p></div><div class="panel"><h3>Prompting</h3><p>Gives instructions and context at use time.</p><p class="rtl">استعمال کے وقت instructions اور context دینا۔</p></div></div>`},
{tag:'Unique Insight 06', title:'AI does not automatically remember everything', urdu:'AI خود بخود سب کچھ یاد نہیں رکھتی', body:`<div class="grid2"><div class="panel"><p>Many people assume a chatbot remembers all previous conversations forever. Usually, memory depends on product settings, saved context, account features, or your own documents.</p><ul><li>Context window ≠ permanent memory.</li><li>Saved memory ≠ full database.</li><li>Privacy settings matter.</li></ul></div><div class="panel rtl"><p>اکثر لوگ سمجھتے ہیں chatbot پچھلی ہر بات ہمیشہ یاد رکھتی ہے۔ عموماً memory product settings، saved context یا documents پر depend کرتی ہے۔</p><ul><li>Context window مستقل memory نہیں۔</li><li>Saved memory مکمل database نہیں۔</li><li>Privacy settings بہت اہم ہیں۔</li></ul></div></div>`},
{tag:'Data Privacy', title:'Never paste private data into a tool you do not trust', urdu:'غیر معتبر tool میں private data نہ ڈالیں', body:`<div class="grid2"><div class="panel"><p class="lead">Before using any AI tool, ask: who owns the data, where is it stored, can it be used for training, and who can access it?</p><ul><li>Student records</li><li>Donor/member data</li><li>Internal strategy</li><li>Unpublished religious material</li></ul></div><div class="panel rtl"><p class="lead rtl">AI tool استعمال کرنے سے پہلے پوچھیں: data کس کا ہے؟ کہاں store ہوگا؟ training میں جائے گا؟ access کس کو ہے؟</p><ul><li>طلبہ کا record</li><li>donor/member data</li><li>internal strategy</li><li>غیر شائع شدہ دینی مواد</li></ul></div></div>`},
{tag:'Bias', title:'AI learns from society — so it can inherit society’s bias', urdu:'AI معاشرے کے data سے سیکھتی ہے، اس لیے bias بھی آ سکتا ہے', body:`<div class="grid2"><div class="panel"><p>AI systems can reflect patterns in training data. If data contains stereotypes, imbalance, or missing voices, outputs may also show that.</p><ul><li>Gender stereotypes</li><li>Language imbalance</li><li>Western-centric examples</li><li>Weak local cultural context</li></ul></div><div class="panel rtl"><p>AI جس data سے سیکھتی ہے، اگر اس میں stereotypes، imbalance یا missing voices ہوں تو جواب میں بھی bias آ سکتا ہے۔</p><ul><li>gender stereotypes</li><li>زبانوں کا imbalance</li><li>Western examples کا غلبہ</li><li>local culture کی کم سمجھ</li></ul></div></div>`, source:'OECD AI Principles and UNESCO guidance emphasize human-centred, rights-respecting AI use.'},
{tag:'Religious Context', title:'For religious knowledge: AI is assistant, not authority', urdu:'دینی علم میں AI مددگار ہے، authority نہیں', body:`<div class="grid2"><div class="panel bigQuote"><p class="lead">AI can help draft, translate, summarize, organize, and search — but it must not independently issue religious rulings or final public religious claims.</p><ul><li>Source verification is essential.</li><li>Scholar review is essential.</li><li>Audience sensitivity is essential.</li></ul></div><div class="panel rtl bigQuote"><p class="lead rtl">AI draft، translation، summary، organization اور search میں مدد دے سکتی ہے؛ مگر خود سے دینی حکم یا final public religious claim نہیں دینا چاہیے۔</p><ul><li>source verification ضروری ہے۔</li><li>عالم/ماہر کا review ضروری ہے۔</li><li>audience sensitivity ضروری ہے۔</li></ul></div></div>`},
{tag:'Four AI Zones', title:'Four AI zones for every learner', urdu:'ہر learner کے لیے AI کے چار zones', body:`<div class="grid4"><div class="colorCard green"><h3><span class="dot"></span> Green Zone</h3><p><b>Safe support</b>: brainstorming, summaries, language practice.</p><p class="rtl"><b>محفوظ مدد</b>: ideas، summaries، language practice۔</p></div><div class="colorCard blue"><h3><span class="dot"></span> Blue Zone</h3><p><b>Learning zone</b>: explain concepts, quiz me, compare ideas.</p><p class="rtl"><b>سیکھنے کا zone</b>: concepts سمجھانا، quiz، comparison۔</p></div><div class="colorCard orange"><h3><span class="dot"></span> Orange Zone</h3><p><b>Review needed</b>: public posts, lesson material, reports.</p><p class="rtl"><b>review ضروری</b>: public posts، lessons، reports۔</p></div><div class="colorCard red"><h3><span class="dot"></span> Red Zone</h3><p><b>High risk</b>: fatwa-style answers, medical/legal/financial advice.</p><p class="rtl"><b>high risk</b>: فتویٰ نما جواب، medical/legal/financial advice۔</p></div></div>`},
{tag:'Activity 1', title:'Group Activity: classify the use-case', urdu:'گروپ activity: use-case کس zone میں ہے؟', body:`<div class="grid2"><div class="panel activity"><h3>Instructions</h3><p>Give each group 5 examples and ask them to place each one in Green, Blue, Orange, or Red zone.</p><ul><li>Summarize lecture notes</li><li>Write a public religious answer</li><li>Create Urdu caption for event poster</li><li>Analyze private donor data</li><li>Explain photosynthesis to a child</li></ul></div><div class="panel rtl activity"><h3>طریقہ</h3><p>ہر group کو 5 examples دیں اور کہیں کہ Green، Blue، Orange یا Red zone میں رکھیں۔</p><ul><li>lecture notes کی summary</li><li>public religious answer لکھنا</li><li>event poster کے لیے Urdu caption</li><li>private donor data کا analysis</li><li>بچے کو photosynthesis سمجھانا</li></ul></div></div>`},
{tag:'Session 1 Close', title:'Session 1 takeaway', urdu:'سیشن 1 کا خلاصہ', body:`<div class="grid2"><div class="panel"><p class="lead">AI is powerful because it predicts and generates at scale. It is risky because fluent output can look like knowledge even when it is not verified.</p><ul><li>Use AI for acceleration.</li><li>Use humans for judgment.</li><li>Use sources for truth.</li></ul></div><div class="panel rtl"><p class="lead rtl">AI طاقتور ہے کیونکہ یہ prediction اور generation بڑے پیمانے پر کرتی ہے۔ risk یہ ہے کہ fluent output verified علم جیسا لگ سکتا ہے۔</p><ul><li>speed کے لیے AI استعمال کریں۔</li><li>judgment انسان کا رکھیں۔</li><li>truth کے لیے sources استعمال کریں۔</li></ul></div></div>`},
{tag:'Session 2 Opening', title:'Prompting is not magic wording. It is task design.', urdu:'Prompting جادوئی الفاظ نہیں، task design ہے۔', body:`<div class="grid2"><div class="panel"><p class="lead">A strong prompt does four things: gives role, gives context, gives task, and defines quality criteria.</p><div class="promptBox">Role: Act as a patient teacher.
Context: Audience is beginner Urdu-speaking students.
Task: Explain AI hallucination.
Quality: Use simple example, 5 bullets, no jargon.</div></div><div class="panel rtl"><p class="lead rtl">اچھا prompt چار چیزیں دیتا ہے: role، context، task اور quality criteria۔</p><div class="promptBox" dir="ltr">Role: Act as a patient teacher.
Context: Audience is beginner Urdu-speaking students.
Task: Explain AI hallucination.
Quality: Use simple example, 5 bullets, no jargon.</div></div></div>`},
{tag:'Prompt Formula', title:'The CRAFT prompt formula', urdu:'CRAFT prompt formula', body:`<div class="grid2"><div class="panel"><ul><li><b>C — Context:</b> background and audience</li><li><b>R — Role:</b> who AI should act as</li><li><b>A — Action:</b> exact task</li><li><b>F — Format:</b> table, bullets, script, plan</li><li><b>T — Test:</b> success criteria and checks</li></ul></div><div class="panel rtl"><ul><li><b>C — Context:</b> پس منظر اور audience</li><li><b>R — Role:</b> AI کس انداز میں جواب دے</li><li><b>A — Action:</b> اصل کام کیا ہے</li><li><b>F — Format:</b> table، bullets، script، plan</li><li><b>T — Test:</b> جواب کو check کرنے کا معیار</li></ul></div></div>`},
{tag:'Bad vs Good', title:'Bad prompt vs good prompt', urdu:'کمزور prompt اور مضبوط prompt', body:`<div class="grid2"><div class="panel"><h3>Weak</h3><div class="promptBox">Tell me about AI.</div><h3>Better</h3><div class="promptBox">Explain AI to a mixed audience of students and religious workers in 8 simple points. Include 2 real examples, 2 risks, and 3 safe-use rules. Avoid technical jargon.</div></div><div class="panel rtl"><h3>کمزور</h3><p>“AI کے بارے میں بتاؤ۔”</p><h3>بہتر</h3><p>“طلبہ اور دینی کارکنان کے لیے AI کو 8 آسان نکات میں سمجھائیں۔ 2 حقیقی مثالیں، 2 risks، اور 3 safe-use rules دیں۔ technical jargon نہ ہو۔”</p></div></div>`},
{tag:'Verification', title:'The 5-step verification ladder', urdu:'تصدیق کی 5 سیڑھیاں', body:`<div class="grid2"><div class="panel"><ol><li>Ask AI for sources.</li><li>Open the original source yourself.</li><li>Check date and author.</li><li>Compare with one independent source.</li><li>For sensitive topics, ask a human expert.</li></ol></div><div class="panel rtl"><ol><li>AI سے sources مانگیں۔</li><li>اصل source خود کھولیں۔</li><li>date اور author چیک کریں۔</li><li>ایک independent source سے compare کریں۔</li><li>sensitive موضوع پر human expert سے review لیں۔</li></ol></div></div>`},
{tag:'Students', title:'AI for students: tutor, not shortcut', urdu:'طلبہ کے لیے AI: tutor، shortcut نہیں', body:`<div class="grid2"><div class="panel"><p>Good uses:</p><ul><li>Explain difficult concepts at your level.</li><li>Create practice questions.</li><li>Review your draft and show weaknesses.</li><li>Compare two theories.</li></ul><p><b>Avoid:</b> submitting AI work as your own learning.</p></div><div class="panel rtl"><p>اچھے استعمال:</p><ul><li>مشکل concepts اپنی سطح پر سمجھنا۔</li><li>practice questions بنوانا۔</li><li>اپنے draft کی کمزوریاں نکلوانا۔</li><li>دو theories کا comparison۔</li></ul><p><b>احتیاط:</b> AI کا کام اپنی learning کے نام پر submit نہ کریں۔</p></div></div>`},
{tag:'Teachers', title:'AI for teachers: lesson designer + feedback assistant', urdu:'اساتذہ کے لیے AI: lesson designer اور feedback assistant', body:`<div class="grid2"><div class="panel"><ul><li>Generate lesson plans for different levels.</li><li>Create MCQs with answer key and rationale.</li><li>Design rubrics.</li><li>Convert hard text into easier language.</li><li>Give feedback on student drafts — with teacher review.</li></ul></div><div class="panel rtl"><ul><li>مختلف levels کے lesson plans۔</li><li>MCQs، answer key اور rationale۔</li><li>rubrics بنانا۔</li><li>مشکل text کو آسان language میں بدلنا۔</li><li>student drafts پر feedback — teacher review کے ساتھ۔</li></ul></div></div>`},
{tag:'Religious Work', title:'AI for religious communication: speed with scholarship', urdu:'دینی ابلاغ میں AI: رفتار، مگر علمی نگرانی کے ساتھ', body:`<div class="grid2"><div class="panel"><p>Useful areas:</p><ul><li>Translate non-sensitive announcements.</li><li>Summarize long lectures.</li><li>Create social media drafts.</li><li>Prepare audience-specific explanations.</li></ul><p><b>Rule:</b> Public religious claims need source + review.</p></div><div class="panel rtl"><p>مفید کام:</p><ul><li>غیر sensitive اعلانات کی translation۔</li><li>طویل lectures کی summary۔</li><li>social media drafts۔</li><li>audience کے مطابق explanation۔</li></ul><p><b>اصول:</b> public دینی claim کے لیے source + review لازم۔</p></div></div>`},
{tag:'Media', title:'AI for media: script, design, voice, video — but verify', urdu:'Media میں AI: script، design، voice، video — مگر verification لازم', body:`<div class="grid2"><div class="panel"><ul><li>Poster text and caption variations</li><li>Short video scripts</li><li>Translation and subtitles</li><li>Topic research outline</li><li>Audience-specific messaging</li></ul><p><b>Watch out:</b> fake images, synthetic voices, copyright, and wrong claims.</p></div><div class="panel rtl"><ul><li>poster text اور captions</li><li>short video scripts</li><li>translation اور subtitles</li><li>topic research outline</li><li>audience-specific messaging</li></ul><p><b>احتیاط:</b> fake images، synthetic voices، copyright، غلط claims۔</p></div></div>`},
{tag:'Unique Insight 07', title:'AI agents are more risky than chatbots', urdu:'AI agents chatbots سے زیادہ risk رکھتے ہیں', body:`<div class="grid2"><div class="panel"><p>A chatbot answers. An agent may plan, use tools, browse, send messages, update files, or trigger actions. More capability means more control is needed.</p><ul><li>Permissions</li><li>Approval steps</li><li>Logs</li><li>Human confirmation before action</li></ul></div><div class="panel rtl"><p>Chatbot جواب دیتی ہے۔ Agent plan بنا سکتا ہے، tools استعمال کر سکتا ہے، messages بھیج سکتا ہے یا files بدل سکتا ہے۔ صلاحیت زیادہ ہو تو control بھی زیادہ چاہیے۔</p><ul><li>permissions</li><li>approval steps</li><li>logs</li><li>action سے پہلے human confirmation</li></ul></div></div>`},
{tag:'NIST in Plain Words', title:'NIST AI RMF: traffic rules for AI', urdu:'NIST AI RMF: AI کے لیے traffic rules', body:`<div class="grid2"><div class="panel"><p class="lead">NIST AI RMF is a simple way to manage AI risk before harm happens.</p><div class="grid4"><div class="colorCard green"><h3>Govern</h3><p>Who is responsible?</p></div><div class="colorCard blue"><h3>Map</h3><p>Where will AI be used?</p></div><div class="colorCard orange"><h3>Measure</h3><p>How will we test it?</p></div><div class="colorCard red"><h3>Manage</h3><p>What control is needed?</p></div></div><p>Simple example: before AI writes a public answer, define owner, risk, tests, review and correction process.</p></div><div class="panel rtl"><p class="lead rtl">NIST AI RMF کا آسان مطلب: AI کو استعمال کرنے سے پہلے risk سمجھیں اور rules بنائیں۔</p><div class="grid4"><div class="colorCard green"><h3>Govern</h3><p>ذمہ دار کون؟</p></div><div class="colorCard blue"><h3>Map</h3><p>AI کہاں استعمال ہوگی؟</p></div><div class="colorCard orange"><h3>Measure</h3><p>اسے test کیسے کریں گے؟</p></div><div class="colorCard red"><h3>Manage</h3><p>کون سا control چاہیے؟</p></div></div><p>مثال: public جواب سے پہلے owner، risk، testing، review اور correction process طے کریں۔</p></div></div>`, source:'NIST AI RMF 1.0 and NIST AI 600-1 Generative AI Profile.'},
{tag:'Ethics', title:'Responsible AI is not anti-technology', urdu:'Responsible AI ٹیکنالوجی کے خلاف نہیں', body:`<div class="grid2"><div class="panel"><p>Responsible AI means using AI with benefit, safety, fairness, transparency, privacy, and accountability.</p><ul><li>Who benefits?</li><li>Who can be harmed?</li><li>Who checks mistakes?</li><li>Who is accountable?</li></ul></div><div class="panel rtl"><p>Responsible AI کا مطلب ہے فائدہ، حفاظت، انصاف، transparency، privacy اور accountability کے ساتھ AI استعمال کرنا۔</p><ul><li>فائدہ کس کو؟</li><li>نقصان کس کو؟</li><li>غلطی کون check کرے گا؟</li><li>جواب دہ کون ہوگا؟</li></ul></div></div>`, source:'OECD AI Principles promote trustworthy AI respecting human rights and democratic values.'},
{tag:'Regulation', title:'The world is moving toward risk-based AI rules', urdu:'دنیا risk-based AI rules کی طرف جا رہی ہے', body:`<div class="grid2"><div class="panel"><p>The EU AI Act uses a risk-based approach: the higher the risk, the stricter the obligation.</p><ul><li>Minimal risk: normal use</li><li>Limited risk: transparency duties</li><li>High risk: strict controls</li><li>Unacceptable risk: prohibited</li></ul></div><div class="panel rtl"><p>EU AI Act کا اصول آسان ہے: risk جتنا زیادہ، rules اتنے سخت۔</p><ul><li>Minimal risk: عام استعمال</li><li>Limited risk: transparency</li><li>High risk: سخت controls</li><li>Unacceptable risk: ممنوع</li></ul></div></div>`, source:'Council of the European Union overview of the AI Act.'},
{tag:'Science', title:'AI is becoming a discovery machine', urdu:'AI discovery machine بنتی جا رہی ہے', body:`<div class="grid2"><div class="panel"><p>AI is not only for chat. It is helping in science, medicine, climate, materials, and biology. AlphaFold showed how AI can accelerate protein-structure prediction.</p><ul><li>Scientific discovery</li><li>Drug research</li><li>Protein design</li><li>Environmental technology</li></ul></div><div class="panel rtl"><p>AI صرف chat کے لیے نہیں۔ یہ science، medicine، climate، materials اور biology میں مدد دے رہی ہے۔ AlphaFold نے protein structure prediction کو تیز کیا۔</p><ul><li>scientific discovery</li><li>drug research</li><li>protein design</li><li>environmental technology</li></ul></div></div>`, source:'Nobel Prize in Chemistry 2024 recognized Demis Hassabis and John Jumper for protein structure prediction, and David Baker for computational protein design.'},
{tag:'Jobs', title:'AI may not take your job — but someone using AI may redesign it', urdu:'AI نوکری نہیں کھاتی، کام کا انداز بدل دیتی ہے', body:`<div class="grid2"><div class="panel"><p class="lead">The practical question is not “Will AI replace me?” It is “Which parts of my work can AI improve, and which human qualities must I strengthen?”</p><ul><li>Writing drafts faster</li><li>Learning faster</li><li>Researching smarter</li><li>Communicating better</li></ul></div><div class="panel rtl"><p class="lead rtl">اصل سوال یہ نہیں کہ “AI مجھے replace کرے گی؟” اصل سوال یہ ہے کہ “میرے کام کا کون سا حصہ AI بہتر کر سکتی ہے، اور مجھے کون سی انسانی qualities مضبوط کرنی ہیں؟”</p><ul><li>drafts تیز بنانا</li><li>learning تیز کرنا</li><li>research بہتر کرنا</li><li>communication بہتر کرنا</li></ul></div></div>`},
{tag:'Human Edge', title:'The human edge: niyyah, wisdom, empathy, responsibility', urdu:'انسانی برتری: نیت، حکمت، ہمدردی، ذمہ داری', body:`<div class="grid2"><div class="panel"><p>AI can generate options, but humans must carry intention, moral responsibility, lived experience, and care for consequences.</p><ul><li>Judgment</li><li>Ethics</li><li>Context</li><li>Spiritual and social sensitivity</li></ul></div><div class="panel rtl"><p>AI options بنا سکتی ہے، مگر نیت، اخلاقی ذمہ داری، تجربہ اور نتائج کی فکر انسان کے پاس رہتی ہے۔</p><ul><li>judgment</li><li>اخلاق</li><li>context</li><li>روحانی اور سماجی حساسیت</li></ul></div></div>`},
{tag:'Practical Workflow', title:'The SAFE workflow', urdu:'SAFE workflow', body:`<div class="grid4"><div class="colorCard green"><h3>S — Specify</h3><p>Define task, audience, and boundaries.</p><p class="rtl">کام، audience اور limits واضح کریں۔</p></div><div class="colorCard blue"><h3>A — Ask</h3><p>Prompt with context and format.</p><p class="rtl">context اور format کے ساتھ prompt دیں۔</p></div><div class="colorCard orange"><h3>F — Fact-check</h3><p>Verify sources, logic, dates, and tone.</p><p class="rtl">sources، logic، dates اور tone check کریں۔</p></div><div class="colorCard red"><h3>E — Escalate</h3><p>Send sensitive outputs to an expert.</p><p class="rtl">sensitive output expert کو بھیجیں۔</p></div></div>`},
{tag:'7-Day Practice Plan', title:'A simple 7-day AI practice plan', urdu:'7 دن کا AI practice plan', body:`<div class="grid2"><div class="panel"><ol><li>Day 1: Ask AI to explain one concept simply.</li><li>Day 2: Convert a long text into summary.</li><li>Day 3: Make a quiz from notes.</li><li>Day 4: Translate and improve tone.</li><li>Day 5: Compare two ideas.</li><li>Day 6: Verify an AI answer with sources.</li><li>Day 7: Build one personal workflow.</li></ol></div><div class="panel rtl"><ol><li>Day 1: ایک concept آسان زبان میں سمجھائیں۔</li><li>Day 2: طویل text کی summary بنائیں۔</li><li>Day 3: notes سے quiz بنائیں۔</li><li>Day 4: translation اور tone بہتر کریں۔</li><li>Day 5: دو ideas compare کریں۔</li><li>Day 6: AI answer sources سے verify کریں۔</li><li>Day 7: اپنا ایک workflow بنائیں۔</li></ol></div></div>`},
{tag:'Final Activity', title:'Build your personal AI rulebook', urdu:'اپنا personal AI rulebook بنائیں', body:`<div class="grid2"><div class="panel activity"><h3>Write 5 rules</h3><ul><li>I will use AI for...</li><li>I will not use AI for...</li><li>I will verify...</li><li>I will protect...</li><li>I will ask a human expert when...</li></ul></div><div class="panel rtl activity"><h3>5 اصول لکھیں</h3><ul><li>میں AI کو کن کاموں کے لیے استعمال کروں گا؟</li><li>کن کاموں کے لیے نہیں کروں گا؟</li><li>کیا چیز verify کروں گا؟</li><li>کس data کی حفاظت کروں گا؟</li><li>کب human expert سے پوچھوں گا؟</li></ul></div></div>`},
{tag:'Closing', title:'Final message', urdu:'آخری پیغام', body:`<div class="grid2"><div class="panel center"><p class="englishOnly">The future belongs neither to blind AI users nor to AI rejecters. It belongs to people who combine tools with knowledge, ethics, verification, and wisdom.</p></div><div class="panel rtl center"><p class="urduOnly">مستقبل نہ AI کو اندھا استعمال کرنے والوں کا ہے، نہ اسے مکمل رد کرنے والوں کا۔ مستقبل ان لوگوں کا ہے جو tools کو علم، اخلاق، تصدیق اور حکمت کے ساتھ جوڑیں گے۔</p></div></div>`},
{tag:'Sources', title:'Evidence anchors used in this course', urdu:'اس کورس میں استعمال ہونے والے معتبر حوالہ جات', body:`<div class="grid2"><div class="panel"><ul><li>NIST AI RMF 1.0 and NIST AI 600-1 Generative AI Profile.</li><li>UNESCO Guidance for Generative AI in Education and Research.</li><li>OECD AI Principles.</li><li>EU AI Act overview by Council of the European Union.</li><li>Vaswani et al., “Attention Is All You Need,” 2017.</li><li>Nobel Prize in Chemistry 2024 press release on AlphaFold/protein structure prediction.</li><li>Reuters report on ChatGPT reaching 100M users in two months.</li><li>OpenAI “Planning for AGI and beyond” for AGI framing.</li></ul></div><div class="panel rtl"><ul><li>NIST AI RMF 1.0 اور Generative AI Profile.</li><li>UNESCO کی GenAI in Education guidance.</li><li>OECD AI Principles.</li><li>EU AI Act کا risk-based overview.</li><li>2017 Transformer paper: “Attention Is All You Need”.</li><li>Nobel Prize 2024 Chemistry press release: AlphaFold/protein structure prediction.</li><li>Reuters: ChatGPT کے 100M users دو ماہ میں۔</li><li>OpenAI: AGI framing and future capabilities.</li></ul></div></div>`}
];
function render(){
 const deck=document.getElementById('deck');
 deck.innerHTML=slides.map((s,i)=>`<section class="slide" data-i="${i}"><div class="frame"><div class="slideNo">${i+1} / ${slides.length}</div><div class="tag">${s.tag||''}${s.mins?` • ${s.mins}`:''}</div>${s.title?`<h2>${s.title}</h2>`:''}${s.urdu?`<div class="rtl" style="font-size:clamp(21px,2.8vw,42px);font-weight:900;color:var(--green);line-height:1.55;margin-top:-4px">${s.urdu}</div>`:''}<div style="min-height:0;flex:1;display:flex;flex-direction:column">${s.body||''}</div>${s.source?`<div class="source"><b>Evidence anchor:</b> ${s.source}</div>`:''}</div></section>`).join('');
}
render();
let idx=0; const all=()=>[...document.querySelectorAll('.slide')];
function show(n){idx=(n+slides.length)%slides.length; all().forEach((el,i)=>el.classList.toggle('active',i===idx));}
show(0);
document.getElementById('next').onclick=()=>show(idx+1); document.getElementById('prev').onclick=()=>show(idx-1);
document.addEventListener('keydown',e=>{if(['ArrowRight','PageDown',' '].includes(e.key)){e.preventDefault();show(idx+1)} if(['ArrowLeft','PageUp'].includes(e.key)){e.preventDefault();show(idx-1)} if(e.key==='Home')show(0); if(e.key==='End')show(slides.length-1)});
let sx=0,sy=0,st=0; document.addEventListener('touchstart',e=>{const t=e.changedTouches[0]; sx=t.clientX; sy=t.clientY; st=Date.now();},{passive:true});
document.addEventListener('touchend',e=>{const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)){dx<0?show(idx+1):show(idx-1)}else if(Date.now()-st<250&&Math.abs(dx)<12&&Math.abs(dy)<12){t.clientX>innerWidth/2?show(idx+1):show(idx-1)}},{passive:true});
document.getElementById('fsBtn').onclick=()=>{if(!document.fullscreenElement){document.documentElement.requestFullscreen?.()}else{document.exitFullscreen?.()}};
</script>
